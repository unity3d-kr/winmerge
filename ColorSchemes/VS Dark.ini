; ---------------------------------------------------------------------------
; Difference colors - Options > Colors
;
; All diff text uses #D4D4D4 (the VS Dark text color) because every block is
; now dark. Contrast of #D4D4D4 on these blocks stays between 4.0:1 and 9.2:1.
; ---------------------------------------------------------------------------

; changed lines - Default yellow #EFCB05 tone-mapped
Settings/DifferenceColor=0x1F6D7A
Settings/DifferenceDeletedColor=0x424242
Settings/DifferenceTextColor=0xD4D4D4

; current difference - Visual Studio breakpoint red #762C2C
Settings/SelectedDifferenceColor=0x2C2C76
Settings/SelectedDifferenceDeletedColor=0x28285A
Settings/SelectedDifferenceTextColor=0xD4D4D4

; trivial (whitespace only) - Default pale yellow, kept the quietest
Settings/TrivialDifferenceColor=0x28454D
Settings/TrivialDifferenceDeletedColor=0x2E2E2E
Settings/TrivialDifferenceTextColor=0xD4D4D4

; moved block - Default orange #E49B52 tone-mapped
Settings/MovedBlockColor=0x1D3D63
Settings/MovedBlockDeletedColor=0x424242
Settings/MovedBlockTextColor=0xD4D4D4

; moved block, current difference
Settings/SelectedMovedBlockColor=0x27347C
Settings/SelectedMovedBlockDeletedColor=0x2A3868
Settings/SelectedMovedBlockTextColor=0xD4D4D4

; side-only (SNP) - Default pale yellow, quiet
Settings/SNPColor=0x294142
Settings/SNPDeletedColor=0x2E2E2E
Settings/SNPTextColor=0xD4D4D4

; side-only (SNP), current difference
Settings/SelectedSNPColor=0x2C2E63
Settings/SelectedSNPDeletedColor=0x30304E
Settings/SelectedSNPTextColor=0xD4D4D4

; word-level difference inside a changed block
Settings/WordDifferenceColor=0x257D8D
Settings/WordDifferenceDeletedColor=0x2A4884
Settings/WordDifferenceTextColor=0xD4D4D4

; word-level difference inside the current difference
Settings/SelectedWordDifferenceColor=0x3737A4
Settings/SelectedWordDifferenceDeletedColor=0x374986
Settings/SelectedWordDifferenceTextColor=0xD4D4D4


; ---------------------------------------------------------------------------
; System color hook
;
; Must stay enabled: this is what recolors the window chrome inside WinMerge
; (pane title bars, menu and toolbar backgrounds, dialog surfaces). Without
; it those areas keep the light Windows colors while the text pane stays dark.
; The hook patches GetSysColor/GetSysColorBrush in this process only
; (Src/Common/SysColorHook.cpp), it does not change the OS palette.
; ---------------------------------------------------------------------------

Settings/SysColorHookEnabled=1
Settings/SysColorHookColors=2:0x00666666,3:0x002d2d2d,5:0x001e1e1e,8:0x00e2e0e0,9:0x00e3e0e0,12:0x001e1e1e,13:0x00007acc,14:0x00f1f1f1,15:0x00222222,16:0x00161616,17:0x00555555,18:0x00e4e0e0,19:0x00e5e0e0,20:0x00333333,21:0x001e1e1e,27:0x002a2a2a,28:0x00333333

