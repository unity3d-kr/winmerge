; VS Dark - WinMerge color scheme
;
; Text, syntax highlighting, selection and UI colors are the VS Dark values.
; The difference colors come from the Default scheme, tone-mapped for this
; background.
;
; The difference colors keep the hues of the Default scheme (yellow for a
; changed block, red for the current difference, orange for a moved block,
; grey for the ghost fillers). Only lightness and saturation are lowered so
; the blocks sit calmly on the 0x1E1E1E background instead of glowing.
; The anchor is SelectedDifference, mapped to the Visual Studio breakpoint
; red #762C2C; the other blocks were tone-mapped with the same intent.
;
;   hue is preserved, saturation is roughly two thirds of Default, lightness
;   is pulled into the 16-43% range (Default sits at 48-93%).
;
; Ranking after tone-down (brighter = more attention):
;   Selected* > * > *Deleted (ghost fillers, near background)
;   Trivial and SNP stay the quietest, as in Default.
;
; "Ghost" lines are the blank filler lines WinMerge draws where the other
; side has no line (CMergeEditView::GetLineColors2, LF_GHOST branch). They
; are background only, never behind text.
;
; Color values are COLORREF stored as 0x00BBGGRR (blue-green-red), which is
; the same order used by the other .ini scheme files. For reference:
;   #762C2C (RGB) == 0x2C2C76 (this file)

[WinMerge]


; Custom Colors set the predefined colors in the color picker.
; Slots 0, 1, 6, 7, 14, 15 keep the VS Dark palette entries.
; Slots 2-5 and 8-13 follow the difference colors used below.

; background
Custom Colors/0=0x1e1e1e
; text color
Custom Colors/1=0xd4d4d4
; difference #7A6D1F
Custom Colors/2=0x1F6D7A
; difference deleted / ghost #424242
Custom Colors/3=0x424242
; moved block #633D1D
Custom Colors/4=0x1D3D63
; word difference #8D7D25
Custom Colors/5=0x257D8D
; keyword blue
Custom Colors/6=0xd69c56
; comment green
Custom Colors/7=0x55996a
; trivial difference #4D4528
Custom Colors/8=0x28454D
; trivial difference deleted / ghost #2E2E2E
Custom Colors/9=0x2E2E2E
; selected difference #762C2C
Custom Colors/10=0x2C2C76
; selected difference deleted / ghost #5A2828
Custom Colors/11=0x28285A
; selected moved block #7C3427
Custom Colors/12=0x27347C
; word difference deleted #84482A
Custom Colors/13=0x2A4884
; numbers red
Custom Colors/14=0x0000cc
; strings orange
Custom Colors/15=0x7891ce


